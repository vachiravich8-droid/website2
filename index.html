<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>แมพ Roblox</title>
  <meta name="description" content="รวมแมพ Roblox ทั้งหมด พร้อมยอดคนเล่นสดและช่องทางติดต่อ">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@100..900&family=Caveat+Brush&family=Anton&family=Noto+Sans+Thai:wght@500..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/dive.css">
  <script src="/js/pre.js"></script>
</head>
<body>
  <div class="stage">
    <div class="frame">
      <img class="plate" alt="">
      <svg class="wm pre" viewBox="0 0 1440 260" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <linearGradient id="wm-fade" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
            <stop offset=".5" stop-color="#f1f5f3" stop-opacity=".9"/>
            <stop offset="1" stop-color="#d7e6de" stop-opacity=".28"/>
          </linearGradient>
        </defs>
        <text x="14" y="214" textLength="1412" lengthAdjust="spacingAndGlyphs" fill="url(#wm-fade)" data-wordmark></text>
      </svg>
      <img class="cut" alt="">
      <div class="badge pre" aria-hidden="true">
        <img alt="">
        <div class="card">
          <h4>CREATOR<br>CARD</h4>
          <span class="yr"></span>
          <p class="role">ROBLOX MAP CREATOR</p>
          <div class="ph"></div>
          <div class="rows"></div>
        </div>
        <div class="hit"></div>
      </div>
      <div class="script pre" aria-hidden="true">roblox maps</div>
      <video class="trans" muted playsinline preload="auto" aria-hidden="true"></video>
      <img class="caseplate" alt="">
      <div class="screen" aria-hidden="true"><div class="flash"></div></div>
      <button type="button" class="screen-hit" aria-label="เปิดแมพนี้"></button>
    </div>
  </div>

  <div class="ui">
    <button type="button" class="tag t1 pre" data-go="hero">หน้าแรก</button>
    <button type="button" class="tag t2 pre" data-go="case">แมพทั้งหมด</button>
    <button type="button" class="tag t3 pre" data-sheet="updates">อัปเดต</button>
    <button type="button" class="tag t4 pre" data-sheet="contact">ติดต่อผู้สร้าง</button>
    <button type="button" class="logo" data-go="hero" data-name></button>
    <h1 class="sr" data-name></h1>

    <svg class="m-only m-wm pre" viewBox="0 0 1440 240" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="m-wm-fade" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
          <stop offset=".5" stop-color="#f1f5f3" stop-opacity=".9"/>
          <stop offset="1" stop-color="#d7e6de" stop-opacity=".3"/>
        </linearGradient>
      </defs>
      <text x="10" y="210" textLength="1420" lengthAdjust="spacingAndGlyphs" fill="url(#m-wm-fade)" data-wordmark></text>
    </svg>
    <div class="m-only m-script pre" aria-hidden="true">roblox maps</div>
    <div class="m-only m-badge" aria-hidden="true"></div>

    <p class="hint pre"><i></i>เลื่อนลงเพื่อดูแมพ</p>

    <article class="ticket" aria-live="polite">
      <i class="hole h1"></i><i class="hole h2"></i><i class="hole h3"></i><i class="hole h4"></i>
      <h2></h2>
      <div class="rows"><p></p><p></p><p></p></div>
    </article>
    <div class="desc">
      <p class="k"></p>
      <p class="text"></p>
      <p class="num"></p>
      <a class="tag play" target="_blank" rel="noopener">เข้าเล่นบน Roblox ↗</a>
    </div>

    <button type="button" class="nav-case prev">
      <span class="c"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></span>
      <span class="l">แมพ <br>ก่อนหน้า</span>
    </button>
    <button type="button" class="nav-case next">
      <span class="c"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      <span class="l">แมพ <br>ถัดไป</span>
    </button>
  </div>

  <div class="sheet" hidden>
    <section class="panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <i class="hole h1"></i><i class="hole h2"></i>
      <header>
        <h2 id="sheet-title"></h2>
        <button type="button" class="close" aria-label="ปิด">✕</button>
      </header>
      <div class="body"></div>
      <a class="admin" href="/admin/">หลังบ้าน</a>
    </section>
  </div>

  <script type="module" src="/js/dive.js"></script>
</body>
</html>
